services:
  aelum:
    build:
      context: .
      dockerfile: Dockerfile
    image: aelum-image
    privileged: true
    container_name: aelum
    tty: true
    stdin_open: true
    restart: "no"
    entrypoint: ["/bin/bash", "/app/build-iso.sh"]
    environment:
      # Host user id, so build.sh can hand the ISO back to a non-root owner
      - OUTPUT_UID=${UID:-1000}
      - OUTPUT_GID=${GID:-1000}
    volumes:
      - ./scripts/build-iso.sh:/app/build-iso.sh:ro
      - ./output:/app/live-iso/output

  aelum-shell:
    build:
      context: .
      dockerfile: Dockerfile
    image: aelum-image
    privileged: true
    container_name: aelum-shell
    tty: true
    stdin_open: true
    entrypoint: ["/bin/bash"]
    volumes:
      - ./scripts/build-iso.sh:/app/build-iso.sh:ro
      - ./output:/app/live-iso/output
