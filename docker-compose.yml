services:
  arch:
    image: archlinux:latest
    privileged: true
    container_name: arch
    tty: true
    stdin_open: true
    restart: "no"
    entrypoint: ["/bin/bash", "/app/build.sh"]
    volumes:
      - ./build.sh:/app/build.sh:ro
      - ./output:/app/.cache/live-iso/output

  arch-shell:
    image: archlinux:latest
    privileged: true
    container_name: arch-shell
    tty: true
    stdin_open: true
    entrypoint: ["/bin/bash"]
    volumes:
      - ./build.sh:/app/build.sh:ro
      - ./output:/app/.cache/live-iso/output
